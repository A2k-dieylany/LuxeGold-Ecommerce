services:
  - type: web
    name: luxegold
    runtime: docker
    repo: https://github.com/A2k-dieylany/LuxeGold-Ecommerce.git
    branch: main
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_PORT
        sync: false

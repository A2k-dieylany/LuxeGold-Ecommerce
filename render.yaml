services:
  - type: web
    name: luxegold
    runtime: docker
    repo: https://github.com/A2k-dieylany/LuxeGold-Ecommerce.git
    branch: main
    plan: free
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_DB
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASS
        sync: false
